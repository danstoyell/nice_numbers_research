<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="t">Speedup of the overlap join over the public client</title>
<desc id="d">Client time divided by join time on the same production fields. base 57: CPU, 1 thread 7.6x (range 6.9-8.5), CPU, 10 threads 7.3x (range 6.3-8.1), GPU (Apple M4) 27.2x (range 25.6-29.6); base 60: CPU, 1 thread 6.2x (range 5.0-8.0), CPU, 10 threads 4.9x (range 2.8-5.7), GPU (Apple M4) 9.8x (range 6.2-13.0); base 64: CPU, 1 thread 3.6x (range 2.1-4.7), CPU, 10 threads 2.9x (range 2.2-3.4), GPU (Apple M4) 17.4x (range 14.2-21.9).</desc>
<style>
  .bg{fill:#fcfcfb} .ink{fill:#0b0b0b} .ink2{fill:#52514e} .muted{fill:#898781}
  .grid{stroke:#e1e0d9} .axis{stroke:#c3c2b7} .whisk{stroke:#52514e}
  .s1{fill:#2a78d6} .s2{fill:#eb6834} .s3{fill:#1baf7a}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19} .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
    .grid{stroke:#2c2c2a} .axis{stroke:#383835} .whisk{stroke:#c3c2b7}
    .s1{fill:#3987e5} .s2{fill:#d95926} .s3{fill:#199e70}
  }
</style>
